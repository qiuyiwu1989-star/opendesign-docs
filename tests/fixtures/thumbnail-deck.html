<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>QA 多页缩略图</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#e9eeea;color:#163e33}

.slide.active{display:flex;flex-direction:column;justify-content:center;gap:30px}
.slide:nth-child(even){background:#dae6e9;color:#193f67}
h1{font-size:86px;margin:0}p{font-size:28px}span{font-size:20px}
</style></head><body>
<section class="slide active"><span>01 / QA</span><h1>第一页：开始</h1><p>合成测试文档，不含私人数据。</p></section>
<section class="slide"><span>02 / QA</span><h1>第二页：探索</h1><p>切页应保留原本的 Flex 排版。</p></section>
<section class="slide"><span>03 / QA</span><h1>第三页：结构</h1></section>
<section class="slide"><span>04 / QA</span><h1>第四页：内容</h1></section>
<section class="slide"><span>05 / QA</span><h1>第五页：形式</h1></section>
<section class="slide"><span>06 / QA</span><h1>第六页：节奏</h1></section>
<section class="slide"><span>07 / QA</span><h1>第七页：调整</h1></section>
<section class="slide"><span>08 / QA</span><h1>第八页：迭代</h1></section>
<section class="slide"><span>09 / QA</span><h1>第九页：验证</h1></section>
<section class="slide"><span>10 / QA</span><h1>第十页：表达</h1></section>
<section class="slide"><span>11 / QA</span><h1>第十一页：回顾</h1></section>
<section class="slide"><span>12 / QA</span><h1>第十二页：交付</h1></section>
</body></html>
