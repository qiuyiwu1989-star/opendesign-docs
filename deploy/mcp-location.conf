    # Independent MCP process under existing valid Docs TLS origin.
    location = /connect { return 308 /connect/; }
    location ^~ /connect/ {
        client_max_body_size 32m;
        client_body_timeout 20s;
        limit_conn opendesign_mcp_conn 8;
        limit_conn_status 429;
        limit_req zone=opendesign_mcp_rate burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5192;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For '';
        proxy_set_header Connection '';
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        # Suppress inherited editor headers here; upstream supplies the stricter
        # handoff CSP with connect-src self, no-store and no-referrer.
        add_header Strict-Transport-Security 'max-age=31536000' always;
        access_log /var/log/nginx/opendesign-mcp.access.log opendesign_mcp;
        error_log /var/log/nginx/opendesign-mcp.error.log warn;
    }
