<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>编辑与审阅体验</title>
<style>body{margin:0;background:#f4f0e5;color:#24392f;font:20px/1.8 system-ui}main{max-width:800px;margin:auto;padding:60px 48px}h1{font-size:48px;line-height:1.2}section{margin:48px 0;padding:24px;background:#fff9}a{color:#267565}strong{color:#a14e28}</style></head><body><main>
<h1>把意见留在内容旁边</h1>
<p>前面的文字<strong>保留加粗</strong>后面的文字，<a href="#notes">保留链接</a>以及结尾。</p>
<section><h2>先修改，再审阅</h2><p>保存一个版本，圈出这里，留下你的意见。</p></section>
<section id="notes"><h2>带着意见交付</h2><p>导出审阅副本，打开后即可查看此版本的批注。</p></section>
</main></body></html>
