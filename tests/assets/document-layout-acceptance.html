<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>图层布局验收</title><style>body{font:18px sans-serif;margin:32px;color:#243b32}main{max-width:900px;margin:auto}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{padding:24px;border:1px solid #aaa}.stage{position:relative;height:240px;background:#edf3ed;margin-top:24px}@media(max-width:600px){.cards{grid-template-columns:1fr}}</style></head><body><main><h1>图层布局验收</h1><section class="cards"><article class="card"><h2>第一组</h2><p>甲：保持这段格式。</p><p>乙：移动这一段。</p><p>丙：末尾段落。</p></article><article class="card"><h2>第二组</h2><p>不同父容器，不允许误放入。</p></article></section><section class="stage"><div style="position:absolute;left:24px;top:30px;width:180px;height:80px;background:#b9d8c1">自由定位卡片</div><div style="position:absolute;left:240px;top:40px;width:100px;height:80px;transform:rotate(5deg)">旋转对象暂不调整</div></section></main></body></html>
