location = /api/studio-agent/jobs/start {
    limit_req zone=docs_studio_generate burst=2 nodelay;
    limit_req zone=docs_studio_generate_global burst=3 nodelay;
    include /etc/nginx/snippets/docs-studio-proxy.conf;
}
location ^~ /api/studio-agent/ {
    limit_req zone=docs_studio_api burst=30 nodelay;
    include /etc/nginx/snippets/docs-studio-proxy.conf;
}
