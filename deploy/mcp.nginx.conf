# HTTP context, included once through conf.d. IP is never taken from client headers.
limit_req_zone $binary_remote_addr zone=opendesign_mcp_rate:1m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=opendesign_mcp_conn:1m;
log_format opendesign_mcp '$remote_addr $request_method $uri $status $request_time';
