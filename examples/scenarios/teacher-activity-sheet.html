<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>信息判断活动单</title><style>*{box-sizing:border-box}body{font-family:-apple-system,"PingFang SC",sans-serif;color:#233b35;margin:0;background:#eee}main{max-width:800px;margin:24px auto;padding:40px;background:white}h1{font-size:30px}h2{font-size:20px;margin:24px 0 10px}p{font-size:16px;line-height:1.6}.write{min-height:64px;border-bottom:1px solid #a8b6ad;color:#6a786f}.note{font-size:13px}@media print{@page{size:A4;margin:15mm}body{background:white}main{margin:0;padding:0;max-width:none}h2{break-after:avoid}.write{break-inside:avoid}}</style></head><body><main><p class="note">OPENDESIGN / 合成课堂材料 · 一页活动单</p><h1>先查证，再判断。</h1><p>练习消息（虚构）：“学校明天全天停课。”<br>对照材料（虚构）：通知说下午操场维护、体育课改室内；负责老师说其余课程照常。</p><h2>1 · 这句话的主张是什么？</h2><p class="write">我的回答：</p><h2>2 · 我会怎样核对来源与独立证据？</h2><p class="write">我的检查步骤：</p><h2>3 · 哪些已能确认，哪些仍待核实？</h2><p class="write">已能确认：　　　　仍待核实：</p><h2>4 · 用三句话表达现在的判断。</h2><p class="write">我目前认为……因为……还需核实……</p><p class="note">同伴反馈：有没有解释依据？有没有把不确定性说清楚？<br>无需填写姓名或其他个人信息。打印前请预览页数。</p></main></body></html>
